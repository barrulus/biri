body:
  - type: markdown
    attributes:
      value: Before posting, please search existing ideas and upvote instead of duplicating. Votes drive prioritization.
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What should biri do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What problem does it solve, or what does it make possible?
  - type: dropdown
    id: theme
    attributes:
      label: Theme
      description: Which part of biri is this about?
      options:
        - Not sure
        - Shaders
        - Overview
        - Workspaces
        - Floating
        - Layout
        - Window rules
        - Input & binds
        - Outputs
        - IPC
        - Capture
        - Upstream sync
        - Project
    validations:
      required: true
